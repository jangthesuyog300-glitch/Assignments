<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpperCase</title>
    <script>
        function changetext()
        {
            let input=document.getElementById("text").value;
            if(document.getElementById("UpperCase").checked){
                document.getElementById("output").value=input.toUpperCase();
            }else if(document.getElementById("Lowercase").checked){
                document.getElementById("output").value=input.toLowerCase();
            }
        }
    </script>
</head>
<body >
    <input type="text" id="text" placeholder="Enter Text"/>
    <label> UpperCase
    <input type="radio" id="UpperCase"/>
    </label>
    <label>LowerCase
    <input type="radio" id="Lowercase"/>
    </label>
    <input type="text" id="output" readonly/>
    <button onclick="changetext()"> convertText</button>
     
    
</body>
</html>
