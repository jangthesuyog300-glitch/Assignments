<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Login Display</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 6px 12px;
    }
    th {
      background-color: #f0f0f0;
    }
    .error {
      color: red;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h2>User Login</h2>
  <!-- Corrected form tag -->
  <form id="loginForm">
    <div>
      <label for="user">Username: </label>
      <input type="text" id="user" placeholder="User Name" />
    </div>
    <div>
      <label for="pass">Password: </label>
      <input type="password" id="pass" placeholder="Password" />
    </div>
    <br />
    <button type="submit" onclick="">Submit</button>

    <p id="errorMsg" class="error"></p>
  </form>

  <h3>Submitted Users</h3>
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Password</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    // Reference form, table body, and error message element
    const form = document.getElementById("loginForm");
    const tableBody = document.getElementById("tableBody");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent form from submitting/reloading

      const username = document.getElementById("user").value.trim();
      const password = document.getElementById("pass").value.trim();

      // Simple validation for input presence
      if (!username || !password) {
        errorMsg.textContent = "Please enter both username and password.";
        return;
      }

      errorMsg.textContent = ""; // Clear previous errors

      // Create new row and cells
      const newRow = tableBody.insertRow();
      const usernameCell = newRow.insertCell(0);
      const passwordCell = newRow.insertCell(1);

      usernameCell.textContent = username;
      passwordCell.textContent = password;
      window.location.href='animation.html';

      // Clear input fields after adding to table
      form.reset();
    });
  </script>
 

</body>
</html>
