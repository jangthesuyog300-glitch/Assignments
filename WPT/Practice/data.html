<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Date</h1>
    <div id="timer"></div>
    <script>
        function showTime() {
      const now = new Date();
      document.getElementById("timer").textContent = now.toLocaleTimeString();
    }
    setInterval(showTime, 1000);
    </script>
</body>
</html>
